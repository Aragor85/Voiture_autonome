name: Build & Deploy segmentation-urbaine to Azure via ACR

on:
  push:
    branches:
      - voiture-autonome
  workflow_dispatch:

env:
  ACR_NAME: voitureautonome
  ACR_LOGIN_SERVER: voitureautonome.azurecr.io
  IMAGE_NAME: segmentation-urbaine-app
  WEBAPP_NAME: segmentation-urbaine
  DOCKER_BUILDKIT: 1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Récupère le code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) Auth Azure via SPN
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3) Auth à l’ACR
      - name: Azure Container Registry Login
        run: az acr login --name ${{ env.ACR_NAME }}

      # ✅ Étape debug : afficher les fichiers présents
      - name: List project files (debug)
        run: |
          echo "::group::Project Tree"
          sudo apt-get update && sudo apt-get install tree -y
          tree -a -L 3
          echo "::endgroup::"

      # 4) Build & push avec Docker
      - name: Build, tag and push image
        run: |
          docker build \
            --file ./Dockerfile \
            --tag ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest \
            .
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      # 5) Déployer sur Azure App Service
      - name: Deploy to Azure Web App (via ACR)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
