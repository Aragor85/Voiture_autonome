name: Build & Deploy segmentation-urbaine to Azure via ACR

on:
  push:
    branches:
      - voiture-autonome
  workflow_dispatch:

env:
  ACR_NAME: voitureautonome
  ACR_LOGIN_SERVER: voitureautonome.azurecr.io
  IMAGE_NAME: segmentation-urbaine-app
  WEBAPP_NAME: segmentation-urbaine
  DOCKER_BUILDKIT: 0

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Récupère le code source
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) Connexion à Azure
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3) Connexion à ACR
      - name: Azure Container Registry Login
        run: az acr login --name ${{ env.ACR_NAME }}

      # 4) Nettoyage du cache Docker
      - name: Docker cache cleanup
        run: docker builder prune -f

      # 5) Build & push image
      - name: Build, tag and push image (no-cache)
        run: |
          docker build --no-cache \
            --file ./Dockerfile \
            --tag ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest \
            .
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      # 6) Déploiement sur Azure Web App via ACR
      - name: Deploy to Azure Web App (via ACR)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
