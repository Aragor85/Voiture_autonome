name: Build and Push Docker Image

on:
  push:
    branches:
      - main  # adapte selon ta branche

env:
  ACR_LOGIN_SERVER: voitureautonome.azurecr.io
  IMAGE_NAME: segmentation-urbaine-app

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: List repo contents for debugging
        run: |
          echo "Contenu racine :"
          ls -l
          echo "Contenu dossier app/:"
          ls -lR app/
          echo "Contenu dossier api/:"
          ls -lR api/

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}     # configure dans GitHub Secrets
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build, tag and push Docker image
        env:
          DOCKER_BUILDKIT: 1
        run: |
          docker build --no-cache --file ./Dockerfile --tag $ACR_LOGIN_SERVER/$IMAGE_NAME:latest .
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:latest
