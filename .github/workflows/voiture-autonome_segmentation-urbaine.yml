name: Deploy segmentation-urbaine to Azure via ACR

on:
  push:
    branches:
      - voiture-autonome  
  workflow_dispatch:

env:
  ACR_NAME: voitureautonome
  ACR_LOGIN_SERVER: voitureautonome.azurecr.io
  IMAGE_NAME: segmentation-urbaine-app
  WEBAPP_NAME: segmentation-urbaine

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Azure Container Registry Login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Disable BuildKit
        run: |
          echo '{"features":{"buildkit":false}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Build Docker image
        run: |
          docker build . -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Push Docker image to ACR
        run: |
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Azure Web App (via ACR)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          images: ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
